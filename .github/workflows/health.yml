name: health
# 일일 소스 헬스체크 — 프로덕션 채널 골든 질의 실측(source_profile health, 채널별 ms 포함)
# + 같은 기록 묶기 회귀(v1.86~89: 협약기관·IA 사본 ↔ NARA 원본 병합이 실제로 일어나는지).
# 알림 기준(v3.58): 기지(旣知) 🔴는 foia(서울정보소통광장 시간 초과) 하나뿐이고, **기지 외 🔴가 1채널이라도 있으면 즉시 실패**한다.
#   옛 기준은 '🔴 3채널 이상' + 기지 목록 gallica·foia였는데, gallica는 복구(🟢)되고 국가기록원(archives)이 코드 04로 죽은 2026-11-27 장애를
#   3채널 미만이라 그대로 놓쳤다(심사 기간에 대표 국내 기관이 사는 일을 자동 감시가 못 잡는 공백). 기지 채널이 복구되거나
#   새로 죽으면 KNOWN 집합과 이 기준을 조정할 것. 주기는 주 1회 → 매일로 당긴다(주 1회면 최대 7일 늦게 발견).
# v3.55 foia가 복구되면(숫자 판정) '0건 표지 실측 필요' 이슈를 자동으로 연다(미실측 후보 표지를 확정하기 위해).
on:
  schedule:
    - cron: '23 21 * * *'   # 매일 06:23 KST
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: production 헬스체크 호출
        run: |
          PV="https://korea-archive-mcp.vercel.app/api/mcp"
          H1='Content-Type: application/json'
          H2='Accept: application/json, text/event-stream'
          curl -sS -m 30 -D /tmp/h.txt -H "$H1" -H "$H2" -H "X-KA-Probe: health" -X POST "$PV" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-health","version":"1.0"}}}' -o /dev/null
          SID=$(grep -i '^mcp-session-id:' /tmp/h.txt | tr -d '\r' | awk '{print $2}')
          curl -sS -m 30 -H "$H1" -H "$H2" -H "X-KA-Probe: health" -H "Mcp-Session-Id: $SID" -X POST "$PV" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' -o /dev/null
          curl -sS -m 150 -H "$H1" -H "$H2" -H "X-KA-Probe: health" -H "Mcp-Session-Id: $SID" -X POST "$PV" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"source_profile","arguments":{"institution":"health"}}}' \
            -o /tmp/health.raw
          sed 's/^data: //' /tmp/health.raw | grep -m1 '^{' > /tmp/health.json
          python3 - <<'EOF'
          import json, os, re, sys
          KNOWN = {'foia'}  # 기지(旣知) 장애 — 서울정보소통광장 연결 실패(6s 타임아웃). 복구되면 이 집합에서 뺄 것
          d = json.load(open('/tmp/health.json'))
          text = d['result']['content'][0]['text']
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## 소스 헬스체크\n```\n' + text + '\n```\n')
          # 채널 줄만 센다('🔴 archives: …' — 소문자 채널 키). 파이프라인 신선도 줄('🔴 연구원 연구DB 색인(…)')과 범례는 제외
          red = re.findall(r'^🔴\s*([a-z0-9_]+)\s*:', text, re.M)
          unknown = sorted({c for c in red if c not in KNOWN})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'\n- 🔴 {len(red)}채널 {sorted(set(red))} · 기지 {sorted(set(red) & KNOWN)} · 기지 외 {unknown}\n')
          if unknown:
              print(f'::error::🔴 기지 외 채널 장애 {len(unknown)}곳({", ".join(unknown)}) — 기지 {sorted(KNOWN)} 외 🔴는 즉시 점검(대표 기관이 죽은 채 심사에 들어가면 실행 완성도 점수 전체가 위험).')
              sys.exit(1)
          print(f'기지 외 🔴 없음(기지 {sorted(set(red) & KNOWN) or "해당 없음"})')
          EOF
      - name: 기지 차단 채널 복구 감지(foia) — 복구 시 0건 표지 실측 이슈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v3.55 foia(서울정보소통광장)는 국내 리전에서도 연결 실패 중이라 0건 표지(zeroOr)가 미실측 후보다. 복구되면 곧바로 실측해야 하므로 자동으로 알린다.
          PV="https://korea-archive-mcp.vercel.app/api/mcp"
          H1='Content-Type: application/json'
          H2='Accept: application/json, text/event-stream'
          curl -sS -m 30 -D /tmp/h3.txt -H "$H1" -H "$H2" -H "X-KA-Probe: health" -X POST "$PV" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-recover","version":"1.0"}}}' -o /dev/null
          SID=$(grep -i '^mcp-session-id:' /tmp/h3.txt | tr -d '\r' | awk '{print $2}')
          curl -sS -m 30 -H "$H1" -H "$H2" -H "X-KA-Probe: health" -H "Mcp-Session-Id: $SID" -X POST "$PV" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' -o /dev/null
          for q in zqxjvwkpq 청계천; do
            curl -sS -m 90 -H "$H1" -H "$H2" -H "X-KA-Probe: health" -H "Mcp-Session-Id: $SID" -X POST "$PV" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"cross_search\",\"arguments\":{\"query\":\"$q\",\"sources\":\"foia\",\"max_per_source\":2}}}" \
              | sed 's/^data: //' | grep -m1 '^{' > "/tmp/foia_$q.json" || true
          done
          python3 - <<'EOF'
          import json, os, re, subprocess
          res = {}
          for q in ("zqxjvwkpq", "청계천"):
              try: t = json.load(open(f"/tmp/foia_{q}.json"))["result"]["content"][0]["text"]
              except Exception as e: t = f"(응답 판독 불가 {e})"
              m = re.search(r"foia:(\d+|—)", t); res[q] = (m[1] if m else "?", t)
          line = " · ".join(f"{q}={v[0]}" for q, v in res.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f: f.write(f"## 기지 차단 채널 복구 감지\n- foia: {line}\n")
          print("foia:", line)
          if any(v[0].isdigit() for v in res.values()):
              title = "기지 차단 채널 복구 감지 — foia(서울정보소통광장): 0건 표지 실측 필요"
              have = subprocess.run(["gh", "issue", "list", "--repo", os.environ["GITHUB_REPOSITORY"], "--state", "open", "--search", title, "--json", "number", "-q", ".[0].number"], capture_output=True, text=True).stdout.strip()
              if not have:
                  body = (f"헬스체크가 foia 응답을 판독했습니다({line}).\n\n"
                          "할 일: ① 무의미 질의(zqxjvwkpq) 응답 본문에서 0건 표지를 실측(조회 실패 메시지의 '본문:' 동봉 부분 또는 직접 열람) → "
                          "② route.js foia·server.py _c_foia의 zeroOr 표지를 실측값으로 확정 → ③ ledger_merge.py COVERAGE_STRICT에 foia 추가 → "
                          "④ 골든 must/must_not 추가. MAINTAINING.md '확정 0' 항목 참고.\n\n"
                          + "\n".join(f"- {q}: {v[1][:300]}" for q, v in res.items()))
                  subprocess.run(["gh", "issue", "create", "--repo", os.environ["GITHUB_REPOSITORY"], "--title", title, "--label", "auto-health", "--body", body], check=False)
          EOF
      - name: 같은 기록 묶기 회귀 검사
        run: |
          PV="https://korea-archive-mcp.vercel.app/api/mcp"
          H1='Content-Type: application/json'
          H2='Accept: application/json, text/event-stream'
          curl -sS -m 30 -D /tmp/h2.txt -H "$H1" -H "$H2" -H "X-KA-Probe: health" -X POST "$PV" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-sameas","version":"1.0"}}}' -o /dev/null
          SID=$(grep -i '^mcp-session-id:' /tmp/h2.txt | tr -d '\r' | awk '{print $2}')
          curl -sS -m 30 -H "$H1" -H "$H2" -H "X-KA-Probe: health" -H "Mcp-Session-Id: $SID" -X POST "$PV" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' -o /dev/null
          call() { curl -sS -m 90 -H "$H1" -H "$H2" -H "X-KA-Probe: health" -H "Mcp-Session-Id: $SID" -X POST "$PV" -d "$1" | sed 's/^data: //' | grep -m1 '^{' > "$2"; }
          call '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"cross_search","arguments":{"query":"장진호","sources":"nara,koreanwar","max_per_source":5,"format":"csv"}}}' /tmp/kw.json
          call '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"cross_search","arguments":{"query":"\"MISCELLANEOUS SCENES KOREAN SOLDIERS\"","sources":"nara,ia","max_per_source":5,"format":"csv"}}}' /tmp/ia.json
          python3 - <<'EOF'
          import json, os, re, sys
          def rows(path):
              t = json.load(open(path))['result']['content'][0]['text']
              head = t.splitlines()[0]
              return t, head
          fail, out = [], []
          for path, a, b, label in [('/tmp/kw.json', 'nara', 'koreanwar', '장진호 — NARA×협약기관'),
                                    ('/tmp/ia.json', 'nara', 'ia', 'NAID 44175 — NARA×인터넷 아카이브')]:
              t, head = rows(path)
              # 채널이 결과를 못 냈으면(외부 장애·키 부재) 회귀 판정 불가 → 경고만
              dead = [c for c in (a, b) if re.search(rf'\b{c}:(0|—)', head)]
              merged = [ln for ln in t.splitlines() if re.search(rf'"{a}[^"]*\+{b}|"{b}[^"]*\+{a}|"{a}·원본확인\+{b}', ln)]
              if dead:
                  out.append(f'⚠️ {label}: 채널 {dead} 결과 없음 — 판정 보류 ({head})')
                  print(f'::warning::{label} 판정 보류 — {dead} 결과 없음')
              elif merged:
                  out.append(f'✅ {label}: 묶인 기록 {len(merged)}건')
              else:
                  out.append(f'❌ {label}: 두 채널 모두 결과가 있는데 묶인 기록 0건 ({head})')
                  fail.append(label)
          print('\n'.join(out))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## 같은 기록 묶기 회귀\n' + '\n'.join(f'- {x}' for x in out) + '\n')
          if fail:
              print('::error::같은 기록 묶기 회귀 실패 — ' + ', '.join(fail) + ' (원 사이트 상세 구조·NARA 응답 형식 변경 의심)')
              sys.exit(1)
          EOF
      - name: 실패 → 'auto-health' 이슈 기록
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-health --color B60205 --description "자동 감시가 발견한 장애" 2>/dev/null || true
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --repo "${{ github.repository }}" --label auto-health --state open --search "헬스체크" --json number -q '.[0].number')
          msg="헬스체크 실패 — 채널 장애 또는 같은 기록 묶기 회귀. 실행 요약: $url · 조치: MAINTAINING.md '사이트가 바뀌었을 때'."
          if [ -n "$num" ]; then gh issue comment "$num" --repo "${{ github.repository }}" --body "$msg"; else gh issue create --repo "${{ github.repository }}" --title "헬스체크 실패" --label auto-health --body "$msg"; fi
