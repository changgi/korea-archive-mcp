name: fixity-watch
# 골든 기록 본문 지문 주간 재계산 → docs/fixity-ledger.json 원장 대조.
# 불일치=원문 개정 발생: 원장에 이력 축적·커밋 후 실패(알림). 서버 판독과 동일 알고리즘(sha256-16) — 2026-11-21 3종 일치 실측.
# 스크립트 base64 임베드(YAML heredoc 함정 회피).
on:
  schedule:
    - cron: '23 22 * * 2'   # 매주 화 07:23 KST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 지문 재계산·대조
        timeout-minutes: 6
        run: |
          set +e
          echo "" | base64 -d > /tmp/fixwatch.mjs
          node /tmp/fixwatch.mjs
          rc=$?
          git add docs/fixity-ledger.json
          if git diff --cached --quiet; then echo "원장 변경 없음"; exit $rc; fi
          git config user.name changgi
          git config user.email 10678518+changgi@users.noreply.github.com
          git commit -m "chore(fixity-watch): 골든 기록 지문 원장 갱신"
          git push
          exit $rc
