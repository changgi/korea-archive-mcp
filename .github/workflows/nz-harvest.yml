name: nz-harvest
# Archives NZ 한국 관련 레코드 주간 수확 → public/nz-index.json (정적 인덱스).
# 배경: federated-search 공개 API는 평문 GET로 동작(9차 실측)하나 Incapsula가 클라우드 IP(icn1·개발망)를
# 차단 — GH 러너는 통과. 우회가 아니라 접근이 허용된 환경에서 수확해 자체 도메인에서 서빙한다.
# nzarch 수집기는 라이브 실패 시 이 인덱스로 폴백. 스크립트는 base64 임베드(heredoc 함정 회피).
on:
  schedule:
    - cron: '7 22 * * 2'   # 매주 화 07:07 KST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 수확·병합·커밋
        run: |
          set -e
          echo "" | base64 -d > /tmp/harvest.mjs
          node /tmp/harvest.mjs > public/nz-index.json
          echo "records: $(node -e "console.log(JSON.parse(require('fs').readFileSync('public/nz-index.json','utf8')).count)")"
          if git diff --quiet public/nz-index.json; then echo "변경 없음"; exit 0; fi
          git config user.name changgi
          git config user.email 10678518+changgi@users.noreply.github.com
          git add public/nz-index.json
          git commit -m "chore(nz-harvest): Archives NZ 한국 관련 인덱스 주간 갱신"
          git push
