name: nz-probe
# Archives NZ 역공학 6차 — AIMS는 UI 글루 확정. 이번: importmap 전체(포틀릿 ESM 경로) +
# result 포틀릿의 Wicket 리소스 URL을 페이지에서 동적 추출해 직접 호출(서버사이드 조각 확인).
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: importmap·Wicket 리소스 추적
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          B="https://collections.archives.govt.nz"
          curl -sSL -m 30 -A "$UA" -c /tmp/cj -o /tmp/p2 "$B/web/arena/search?q=Korea"
          echo "::group::importmap full"
          tr '\n' ' ' < /tmp/p2 | grep -oE '<script type="importmap">.{0,4500}' | head -c 4600; echo
          echo "::endgroup::"
          echo "::group::esm/module scripts"
          grep -oE '<script[^>]*type="module"[^>]*>' /tmp/p2 | head -10
          grep -oE '"/o/[a-zA-Z0-9_.-]*federated[^"]*"' /tmp/p2 | sort -u | head -10
          grep -oE '"/o/[^"]*__liferay__[^"]*"' /tmp/p2 | sort -u | head -20
          echo "::endgroup::"
          echo "::group::result portlet wicket urls"
          grep -oE '(https://[^"]*|/web/arena[^"]*)(_federated_search_result_portlet_|federated_search_result_portlet)[^"]*' /tmp/p2 | sort -u | head -10
          echo "::endgroup::"
          U=$(grep -oE 'https://[^"]*federated_search_result_portlet[^"]*' /tmp/p2 | head -1 | sed 's/&amp;/\&/g')
          if [ -n "$U" ]; then
            hc=$(curl -sSL -m 25 -A "$UA" -b /tmp/cj -c /tmp/cj -o /tmp/w -w '%{http_code} %{size_download} %{content_type}' "$U")
            echo "[wicket-call] $U"
            echo " → $hc"
            echo "::group::wicket response head"
            head -c 1200 /tmp/w
            echo; echo "::endgroup::"
          else
            echo "no result-portlet wicket url in page"
          fi
          true
