name: nz-probe
# Archives NZ 역공학 8차 — 7차 수확: /local-rest/api/v1/configs/portalsites 실존(200 JSON).
# 이번: ① 그 설정 JSON 전문 ② 브라우저에서 실제 검색어 입력+엔터로 검색 XHR 포획.
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 설정 덤프 + 검색 XHR 포획
        timeout-minutes: 7
        run: |
          set -e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          echo "::group::portalsites config"
          curl -sS -m 20 -A "$UA" -H "Accept: application/json" "https://collections.archives.govt.nz/local-rest/api/v1/configs/portalsites?vhost=collections.archives.govt.nz" | head -c 3500; echo
          echo "::endgroup::"
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1 >/dev/null 2>&1
          echo "" | base64 -d > cap.mjs
          node cap.mjs
