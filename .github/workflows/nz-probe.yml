name: nz-probe
# Archives NZ 역공학 7차(결정타) — GH 러너에서 헤드리스 크롬으로 검색 페이지를 실제 로드,
# 네트워크 요청 전수 캡처(XHR URL·상태·JSON 응답 머리). 스크립트는 base64 임베드(YAML heredoc 함정 회피).
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 브라우저 네트워크 캡처
        timeout-minutes: 6
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1 >/dev/null 2>&1
          echo "" | base64 -d > cap.mjs
          node cap.mjs
