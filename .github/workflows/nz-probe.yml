name: nz-probe
# Archives NZ 역공학 10차(마지막) — 9차 판정: 평문 GET 200(공개 API, SSE 프레임 JSON).
# 이번: size=1 전체 히트 JSON 구조 덤프 → 수집기 파서 확정. 이후 이 워크플로 삭제.
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 단건 전체 JSON
        timeout-minutes: 4
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -sS -m 20 -A "$UA" -o /tmp/a "https://collections.archives.govt.nz/federated-search/customers/aims/search?size=1&facetSize=0&start=0&q=Chosin&isFuzzy=true&sourceId=aims-archive"
          echo "size: $(wc -c </tmp/a)"
          sed -n 's/^data://p' /tmp/a | head -1 | head -c 6500; echo
          echo "---- 제목 후보 키"
          sed -n 's/^data://p' /tmp/a | head -1 | grep -oE '"(title|name|label|description|heading)[A-Za-z]*":' | sort -u
          true
