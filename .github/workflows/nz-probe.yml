name: nz-probe
# Archives NZ 역공학 10차(마지막) — 단건 전체 히트 JSON 구조 덤프 → 수집기 파서 확정. 질의는 입력으로.
on:
  workflow_dispatch:
    inputs:
      q:
        description: 검색어
        default: Korea
        required: false
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 단건 전체 JSON
        timeout-minutes: 4
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          Q="${{ github.event.inputs.q || 'Korea' }}"
          curl -sS -m 20 -A "$UA" --get --data-urlencode "q=$Q" --data "size=1&facetSize=0&start=0&isFuzzy=true&sourceId=aims-archive" -o /tmp/a "https://collections.archives.govt.nz/federated-search/customers/aims/search"
          echo "q=$Q size: $(wc -c </tmp/a)"
          sed -n 's/^data://p' /tmp/a | head -1 | head -c 6500; echo
          echo "---- 제목 후보 키"
          sed -n 's/^data://p' /tmp/a | head -1 | grep -oE '"(title|name|label|description|heading)[A-Za-z]*":' | sort -u
          true
