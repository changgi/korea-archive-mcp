name: nz-probe
# Archives NZ 역공학 4차 — 3차 발견: 인라인 설정의 프록시 경로(/federated-search · /local-rest/api/v1 · /transaction).
# 이번: 그 경로들을 직접 타격해 공개 REST의 실존·스키마를 확인한다.
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: 프록시 REST 타격
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          B="https://collections.archives.govt.nz"
          hit(){ hc=$(curl -sS -m 20 -A "$UA" -H "Accept: application/json" -o /tmp/r -w '%{http_code} %{size_download} %{content_type}' "$B$1"); echo "[$1] $hc"; echo "  head: $(head -c 300 /tmp/r | tr '\n' ' ')"; }
          hit "/federated-search"
          hit "/federated-search/"
          hit "/federated-search/search?q=Korea"
          hit "/federated-search/search?query=Korea"
          hit "/federated-search/api/search?query=Korea"
          hit "/federated-search/v1/search?query=Korea"
          hit "/federated-search/swagger.json"
          hit "/federated-search/openapi.json"
          hit "/local-rest/api/v1"
          hit "/local-rest/api/v1/"
          hit "/local-rest/api/v1/search?q=Korea"
          hit "/local-rest/api/v1/records?q=Korea"
          hit "/local-rest/api/v1/swagger.json"
          hit "/local-rest/api/v1/openapi.json"
          hit "/local-rest/api/v1/api-docs"
          hit "/transaction"
          true
