name: ledger-watch
# v2.81 원장 신선도 감시 — 6시간마다 마지막 원장 커밋 시각을 본다. 26시간 넘게 갱신이 없으면 ledger를 직접 실행하고(정기 실행 누락 대비),
# 48시간이 넘으면 auto-health 이슈를 연다. 서버 날짜 함은 3일 보관 — 그 안에 병합하면 유실 없음.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 200 }
      - name: 원장 신선도 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git log -1 --format=%ct --grep='chore(ledger)' || echo 0)
          now=$(date +%s); age=$(( (now - ${last:-0}) / 3600 ))
          echo "마지막 원장 커밋: ${age}시간 전"
          if [ "$age" -ge 26 ]; then
            gh workflow run ledger.yml --ref main && echo "ledger 실행 요청(정기 실행 누락 대비)"
          fi
          if [ "$age" -ge 48 ]; then
            body="발견 누적 원장이 ${age}시간째 갱신되지 않았습니다. 서버 날짜 함(Redis)은 3일 보관 — 72시간 안에 ledger 워크플로를 성공시키면 유실 없음. Actions › ledger 실행 기록과 로그를 확인하십시오."
            num=$(gh issue list --label auto-health --state open --search "원장 갱신 중단" --json number -q '.[0].number')
            if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "원장 갱신 중단 — ledger 정기 실행 누락" --label auto-health --body "$body"; fi
          fi
      - name: 운영 Pages 산출물 건강 검사(v3.27)
        # 원장이 게시한 기준·연결 산출물(지명·인물·사건·전거·관계·품질·컬렉션·기준 사전·데이터 목록)이 실제로 열리고 핵심 수치가 0이 아닌지.
        # 실패하면 auto-health 이슈(같은 제목이 열려 있으면 댓글). 통과하면 열린 이슈를 닫는다.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(python3 scripts/pages_health.py); code=$?
          echo "$out"
          num=$(gh issue list --label auto-health --state open --search "Pages 산출물 결함" --json number -q '.[0].number')
          if [ $code -ne 0 ]; then
            body=$(printf '운영 Pages 산출물 검사 실패:\n\n%s\n\n원장(ledger) 실행 로그와 docs/data 커밋을 확인하십시오. 축적 정보는 지우지 않는다 — 이전 커밋에서 복원 가능.' "$out")
            if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "Pages 산출물 결함 — 기준·연결 산출물 점검" --label auto-health --body "$body"; fi
            exit 1
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "운영 Pages 산출물 검사 정상 — 자동 종료"
          fi
