name: ledger
# 발견 누적 원장 — 매일 00:17 KST, 서버 날짜 함(3일 보관)을 꺼내 docs/data/에 병합·커밋 → Pages 공개
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: ledger
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 병합
        run: python3 scripts/ledger_merge.py
      - name: 커밋
        run: |
          git add docs/data
          if git diff --cached --quiet; then echo "원장 변경 없음"; exit 0; fi
          git config user.name changgi
          git config user.email 10678518+changgi@users.noreply.github.com
          git commit -m "chore(ledger): 발견 누적 원장 $(date -u +%F)"
          git push
