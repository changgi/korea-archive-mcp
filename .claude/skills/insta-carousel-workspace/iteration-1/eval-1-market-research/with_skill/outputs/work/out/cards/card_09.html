<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  :root{
    --bg:#181310;        /* 카드 배경 — 따뜻한 다크 브라운 */
    --paper:#f3ead8;     /* 폴라로이드 종이색 */
    --crimson:#c2512f;   /* 포인트1 — 번트 오렌지 */
    --gold:#d9a95e;      /* 포인트2 — 골드 */
    --cream:#f3ead8;     /* 본문 텍스트 */
    --sub:#a39a8c;       /* 보조 텍스트 */
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#0a0705; font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; padding:40px; color:var(--cream);}

  .card{width:1080px; height:1080px; margin:0 auto 56px; position:relative; overflow:hidden;
        background:var(--bg); box-shadow:0 10px 60px rgba(0,0,0,.6);}

  .grain{position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:overlay;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
                     repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 4px);}
  .frame{position:absolute; inset:26px; border:2px solid rgba(217,169,94,.5); pointer-events:none;}
  .frame:after{content:''; position:absolute; inset:8px; border:1px solid rgba(217,169,94,.25);}
  .corner{position:absolute; width:34px; height:34px; border:4px solid var(--gold);}
  .c-tl{top:16px; left:16px; border-right:none; border-bottom:none;}
  .c-tr{top:16px; right:16px; border-left:none; border-bottom:none;}
  .c-bl{bottom:16px; left:16px; border-right:none; border-top:none;}
  .c-br{bottom:16px; right:16px; border-left:none; border-top:none;}

  .kicker{display:inline-block; background:var(--crimson); color:#fff; font-weight:900;
          letter-spacing:.3em; font-size:24px; padding:12px 28px 12px 34px;}
  h1{font-size:84px; line-height:1.22; font-weight:900; word-break:keep-all;}
  h2{font-size:58px; line-height:1.28; font-weight:900; word-break:keep-all;}
  .gold{color:var(--gold);} .red{color:#e2694a;}
  .lead{font-size:33px; line-height:1.6; word-break:keep-all; color:#ddd3c0;}
  .lead b{color:var(--gold);}
  .credit{font-size:20px; color:#948b7d;}
  .divider{height:5px; width:130px; background:linear-gradient(90deg,var(--gold),var(--crimson)); margin:30px 0;}

  .pageno{position:absolute; bottom:52px; right:78px; font-size:23px; color:var(--sub); letter-spacing:.12em; z-index:5;}
  .brand{position:absolute; bottom:52px; left:78px; font-size:23px; color:var(--sub); z-index:5;}

  .stamp{position:absolute; border:5px solid var(--crimson); color:#e2694a; border-radius:10px;
         padding:10px 22px; font-weight:900; font-size:34px; letter-spacing:.15em;
         transform:rotate(-9deg); background:rgba(24,19,16,.55); z-index:6;}
  .polaroid{background:#fbf8f1; padding:16px 16px 0; box-shadow:0 14px 34px rgba(0,0,0,.55);}
  .polaroid img{display:block; width:100%;}
  .polaroid .cap{font-size:22px; color:#3a3f49; padding:12px 4px 14px; font-weight:700; text-align:center;}
  .tape{position:absolute; width:150px; height:40px; background:rgba(217,169,94,.75); box-shadow:0 2px 8px rgba(0,0,0,.3); z-index:6;}
  .li{display:flex; gap:22px; align-items:flex-start; margin:26px 0; font-size:32px; line-height:1.5; word-break:keep-all;}
  .li .n{flex:0 0 54px; height:54px; border-radius:50%; background:var(--crimson); color:#fff;
         font-weight:900; font-size:28px; display:flex; align-items:center; justify-content:center;}
  .li b{color:var(--gold);}
  .org{background:#221b15; border:1px solid #3a3025; border-left:8px solid var(--gold);
       padding:16px 26px; margin:12px 0; display:flex; justify-content:space-between; align-items:center;}
  .org .name{font-size:30px; font-weight:900;}
  .org .name small{display:block; font-size:19px; color:#948b7d; font-weight:400; margin-top:4px;}
  .org .hits{font-size:28px; font-weight:900; text-align:right;}
  .hit-y{color:#8fd08a;} .hit-n{color:#e2694a;} .hit-w{color:#d9a95e;}
  .statbox{flex:1; background:#221b15; border:1px solid #3a3025; padding:26px 20px; text-align:center;}
  .statbox .big{font-size:64px; font-weight:900; line-height:1.1;}
  .statbox .lbl{font-size:24px; color:#a39a8c; margin-top:8px;}
  .sheet4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .sheet4 img{width:100%; aspect-ratio:1/1; object-fit:cover; border:1px solid #4a3f30; display:block;}
</style><style>body{margin:0!important;padding:0!important;}.card{margin:0!important;box-shadow:none!important;}</style></head><body><div class="card">
